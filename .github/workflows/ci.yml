name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The generated C is verified against the Python reference on every
      # platform. A C compiler is present by default on all three runners, so the
      # compiler-marked tests run everywhere rather than being quietly skipped --
      # which matters, because they are the ones that validate the code generator.
      - name: Report toolchain
        run: |
          python -c "from cellkernel.verify import find_compiler; print('compiler:', find_compiler())"

      - name: Test
        run: python -m pytest -v --durations=15

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples

  pybamm:
    name: Validated against PyBaMM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pybamm
      # Its own job because the Doyle-Fuller-Newman comparisons are slow, and
      # because PyBaMM is an optional dependency: the rest of the suite must
      # keep passing without it.
      - name: Compare against an independent implementation
        run: python -m pytest tests/test_pybamm_validation.py -v

  arm:
    name: Measured on ARM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the cross toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # Footprint from the linker's own accounting, instruction counts from an
      # emulated Cortex-M4. Both are measurements; the resource budget in the
      # package is a model, and this is what keeps the two honest about each
      # other.
      - name: Cross-compile and count
        run: python -m pytest tests/test_arm_measurement.py -v
      - name: Report the figures
        run: python -m cellkernel.cli measure build/ci_arm --precision float --order 3

  measured:
    name: Checked against a real cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pybamm
      # The dataset belongs to PyBOP and is fetched rather than vendored, so this
      # job needs the network. It is separate for that reason: the rest of the
      # suite must stay runnable offline.
      - name: Fetch the measured LG M50 rate test
        run: python -m cellkernel.data.reference
      - name: Compare against measurement
        run: python -m pytest tests/test_measured_cell.py -v
      - name: Report the figures
        run: python examples/10_against_a_real_cell.py

  coverage:
    name: Coverage does not regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-cov
      # The measured-cell tests skip without the dataset, which would drop the
      # reported coverage below the floor and blame the wrong thing. Fetch it so
      # the number reflects what is actually exercised.
      - name: Fetch the measured dataset
        run: python -m cellkernel.data.reference
      # A floor, not a target. The point is that the command-line interface and
      # the cycler loader -- the two things anyone touches first -- do not drift
      # back to being untested, which is where they were.
      - name: Test with coverage
        run: python -m pytest -q --cov=cellkernel --cov-report=term-missing --cov-fail-under=93

  examples:
    name: Examples run end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run every example
        run: |
          set -e
          for script in examples/*.py; do
            echo "=== $script ==="
            python "$script"
          done

  strict-c:
    name: Generated C under extra scrutiny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Generate
        run: python -m cellkernel.cli generate build/ci --precision float --order 4

      # The generated Makefile already uses -Wall -Wextra -Wpedantic -Werror. This
      # step adds the conversion and shadowing warnings on top, and builds with
      # both gcc and clang, because each catches things the other does not.
      - name: Compile with gcc, extra warnings
        run: |
          cd build/ci
          gcc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror \
              -Wconversion -Wshadow -Wstrict-prototypes -Wmissing-prototypes \
              -Wcast-qual -Wundef -Wdouble-promotion \
              -c cellkernel_estimator.c -o /dev/null
      - name: Compile with clang, extra warnings
        run: |
          cd build/ci
          clang -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror \
                -Wconversion -Wshadow -Wstrict-prototypes -Wmissing-prototypes \
                -c cellkernel_estimator.c -o /dev/null
      # The temperature-scheduled estimator is a separate emitter with its own
      # tables and blending, so it gets the same scrutiny rather than riding on
      # the isothermal one having passed.
      - name: Generate the scheduled variant
        run: python -m cellkernel.cli generate build/ci_scheduled --precision float --order 3 --scheduled
      - name: Compile the scheduled variant with gcc, extra warnings
        run: |
          cd build/ci_scheduled
          gcc -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror \
              -Wconversion -Wshadow -Wstrict-prototypes -Wmissing-prototypes \
              -Wcast-qual -Wundef -Wdouble-promotion \
              -c cellkernel_scheduled.c -o /dev/null
      - name: Compile the scheduled variant with clang, extra warnings
        run: |
          cd build/ci_scheduled
          clang -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror \
                -Wconversion -Wshadow -Wstrict-prototypes -Wmissing-prototypes \
                -c cellkernel_scheduled.c -o /dev/null

      # The charge limiter is the one routine a controller acts on directly, so
      # it gets checked for the properties its callers rely on: bounded time
      # (a fixed iteration count, no early exit) and a result that never exceeds
      # the ceiling it was given.
      - name: Charge limiter is bounded and respects its ceiling
        run: |
          cd build/ci
          test "$(grep -c 'CK_LIMIT_ITERATIONS' cellkernel_estimator.h)" -ge 1
          grep -q 'for (i = 0; i < CK_LIMIT_ITERATIONS' cellkernel_estimator.c
          ! grep -A6 'for (i = 0; i < CK_LIMIT_ITERATIONS' cellkernel_estimator.c | grep -q 'break'
          cat > limit_check.c <<'EOF'
          #include "cellkernel_estimator.h"
          #include <stdio.h>
          int main(void) {
              ck_estimator_t est;
              ck_real_t soc;
              for (soc = (ck_real_t) 0.05; soc < (ck_real_t) 1.0; soc += (ck_real_t) 0.05) {
                  ck_real_t limit, phi;
                  ck_init(&est, soc);
                  limit = ck_max_charge_current(&est, (ck_real_t) 0.01, CK_LIMIT_CEILING);
                  if (limit < 0 || limit > CK_LIMIT_CEILING) {
                      printf("out of range at soc %f: %f\n", (double) soc, (double) limit);
                      return 1;
                  }
                  if (limit > 0) {
                      phi = ck_plating_potential(&est, -limit);
                      if (phi < (ck_real_t) 0.01 - (ck_real_t) 1e-4) {
                          printf("margin violated at soc %f: %f\n", (double) soc, (double) phi);
                          return 1;
                      }
                  }
              }
              printf("ok\n");
              return 0;
          }
          EOF
          gcc -std=c99 -O2 -Wall -Wextra -Werror -o limit_check \
              limit_check.c cellkernel_estimator.c -lm
          ./limit_check

      - name: Undefined-behaviour sanitiser on the harness
        run: |
          cd build/ci
          clang -std=c99 -O1 -g -fsanitize=undefined,address \
                -fno-omit-frame-pointer \
                -o ck_harness_san ck_harness.c cellkernel_estimator.c -lm
          python - <<'PY'
          import subprocess
          rows = "\n".join(f"{2.5},{3.9}" for _ in range(400))
          done = subprocess.run(["./ck_harness_san", "filter", "0.8"],
                                input=rows, capture_output=True, text=True)
          print(done.stderr[-4000:])
          assert done.returncode == 0, done.stderr
          PY
